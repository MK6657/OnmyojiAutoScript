<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>OAS 控制中心 · 前端样式预览</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #edf2f7;
      --rail: #dce7f2;
      --pane: #f5f8fb;
      --surface: #ffffff;
      --surface-soft: #f7f9fc;
      --line: #d9e1ea;
      --line-strong: #c9d4df;
      --text: #17283b;
      --muted: #718196;
      --blue: #387cf0;
      --blue-soft: #e5efff;
      --green: #2fa56d;
      --green-soft: #e7f7ee;
      --yellow: #cb8a1d;
      --yellow-soft: #fff5dc;
      --red: #d85e6b;
      --shadow: 0 8px 24px rgba(55, 84, 115, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 1040px;
      height: 100vh;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font: 13px/1.45 "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    button, input { font: inherit; }
    button { border: 0; cursor: pointer; color: inherit; }
    .app { display: grid; grid-template-columns: 58px 220px minmax(0, 1fr); height: 100vh; }

    .rail {
      display: flex; flex-direction: column; align-items: center; padding: 14px 9px;
      background: var(--rail); border-right: 1px solid #cbd7e3;
    }
    .rail-logo {
      width: 34px; height: 34px; margin-bottom: 20px; display: grid; place-items: center;
      border-radius: 10px; color: #fff; background: #4388f5; font-size: 18px;
      box-shadow: 0 5px 12px rgba(56, 124, 240, .25);
    }
    .rail-nav { display: grid; gap: 8px; width: 100%; }
    .rail-btn {
      width: 40px; height: 40px; margin: auto; border-radius: 10px; color: #263b52;
      background: transparent; font-size: 18px;
    }
    .rail-btn:hover { background: rgba(255,255,255,.55); }
    .rail-btn.active { color: var(--blue); background: #c9dcff; box-shadow: inset 3px 0 var(--blue); }
    .rail-spacer { flex: 1; }
    .rail-menu { font-size: 26px; line-height: 1; }

    .accounts {
      display: flex; flex-direction: column; min-width: 0; overflow: hidden;
      background: var(--pane); border-right: 1px solid var(--line);
    }
    .pane-top { display: flex; gap: 10px; padding: 15px 11px 10px; }
    .search-wrap { position: relative; flex: 1; }
    .search-wrap input, .task-search {
      width: 100%; border: 1px solid transparent; outline: none; border-radius: 5px;
      color: var(--text); background: var(--surface); padding: 8px 9px 8px 28px;
    }
    .search-wrap input:focus, .task-search:focus { border-color: #94b9f9; }
    .search-mark { position: absolute; left: 9px; top: 7px; color: var(--muted); font-size: 14px; }
    .icon-btn { display: grid; place-items: center; min-width: 30px; height: 30px; border-radius: 6px; color: #304b67; background: transparent; font-size: 19px; }
    .icon-btn:hover { background: #e3ebf4; }
    .account-actions { display: flex; gap: 7px; padding: 0 11px 11px; border-bottom: 1px solid var(--line); }
    .account-actions .icon-btn { width: 29px; background: var(--surface); border: 1px solid var(--line); color: var(--blue); font-size: 14px; }
    .account-actions .icon-btn:hover { background: var(--blue-soft); }
    .account-list { overflow: auto; padding-bottom: 10px; }
    .account {
      position: relative; display: grid; grid-template-columns: 38px 1fr; gap: 9px; width: 100%;
      padding: 11px 12px; text-align: left; background: transparent; border-bottom: 1px solid rgba(217,225,234,.66);
    }
    .account:hover { background: #eaf1f8; }
    .account.selected { background: #dceaff; box-shadow: inset 3px 0 var(--blue); }
    .account-avatar { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: #aab7c4; font-weight: 700; font-size: 17px; }
    .account-avatar.blue { background: linear-gradient(145deg,#52a6ff,#3284df); }
    .account-avatar.mint { background: linear-gradient(145deg,#57c5de,#3099c8); }
    .account-avatar.gold { background: linear-gradient(145deg,#e0af61,#c7832a); }
    .account-copy { min-width: 0; }
    .account-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
    .account-detail { display: block; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11px; }
    .account-status { display: flex; align-items: center; gap: 5px; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #aab7c4; }
    .running .status-dot { background: #2eaf70; }
    .paused .status-dot { background: #d99c32; }
    .offline .status-dot { background: #aab7c4; }
    .running .account-status { color: var(--green); }
    .paused .account-status { color: var(--yellow); }
    .new-account { margin: 9px 11px; width: calc(100% - 22px); padding: 9px; border: 1px dashed var(--line-strong); border-radius: 6px; color: var(--blue); background: transparent; }
    .new-account:hover { background: var(--blue-soft); }

    .catalog-pane, .selected-pane, .settings-pane { min-width: 0; overflow: auto; border-right: 1px solid var(--line); background: #fff; }
    .catalog-pane { padding: 13px 11px; }
    .column-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .column-head h2 { margin: 0; font-size: 14px; }
    .column-head small { color: var(--muted); font-size: 10px; }
    .catalog-search { width: 100%; margin-bottom: 10px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 5px; outline: none; color: var(--text); background: var(--surface-soft); font-size: 11px; }
    .catalog-search:focus { border-color: #8db3f5; }
    .catalog-group { margin-top: 11px; color: var(--muted); font-size: 10px; }
    .catalog-item { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 7px 5px; border-bottom: 1px solid #edf1f5; color: var(--text); background: transparent; text-align: left; font-size: 11px; }
    .catalog-item:hover { color: var(--blue); background: var(--surface-soft); }
    .catalog-item.active { color: var(--blue); background: var(--blue-soft); }
    .catalog-item small { color: var(--muted); font-size: 10px; }
    .catalog-item span:last-child { color: var(--blue); font-size: 16px; }
    .selected-pane { padding: 13px 11px; background: #fbfcfe; }
    .selected-task-list { display: grid; gap: 7px; }
    .task-tab { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 9px; border: 1px solid var(--line); border-radius: 7px; color: var(--text); background: #fff; text-align: left; }
    .task-tab:hover { border-color: #a9c7f6; }
    .task-tab.active { border-color: #8db3f5; color: #1d5cb6; background: var(--blue-soft); }
    .task-tab strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .task-tab small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .task-tab .remove-task { color: var(--muted); font-size: 14px; }
    .task-tab .remove-task:hover { color: var(--red); }
    .settings-pane { padding: 15px; background: #fff; }
    .settings-pane .column-head { padding-bottom: 11px; border-bottom: 1px solid var(--line); }
    .config-card { margin-top: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-soft); }
    .config-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .config-card-head h3 { margin: 0; font-size: 14px; }
    .config-card-head p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .switch { position: relative; width: 34px; height: 19px; display: inline-block; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span { position: absolute; inset: 0; border-radius: 20px; background: #bdc8d4; transition: .2s; }
    .switch span::before { content: ""; position: absolute; width: 15px; height: 15px; left: 2px; top: 2px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
    .switch input:checked + span { background: var(--green); }
    .switch input:checked + span::before { transform: translateX(15px); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-item label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; }
    .form-item input, .form-item select { width: 100%; padding: 8px 9px; border: 1px solid var(--line-strong); border-radius: 5px; outline: none; color: var(--text); background: #fff; }
    .form-item input:focus, .form-item select:focus { border-color: #8db3f5; }
    .config-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 17px; padding-top: 12px; border-top: 1px solid var(--line); }
    .save-state { color: var(--green); font-size: 10px; }
    .config-foot button { padding: 7px 9px; border-radius: 5px; color: var(--blue); background: var(--blue-soft); font-size: 11px; }
    .config-foot button:hover { background: #d6e6ff; }
    .config-empty { padding: 28px 10px; color: var(--muted); text-align: center; }

    .workspace { display: flex; flex-direction: column; min-width: 0; background: #fff; }
    .workspace-head {
      display: flex; align-items: center; justify-content: space-between; min-height: 74px; padding: 0 21px;
      border-bottom: 1px solid var(--line); background: #fff;
    }
    .selected-title { display: flex; align-items: center; gap: 11px; }
    .selected-title h1 { margin: 0; font-size: 17px; font-weight: 650; }
    .selected-title p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .thread-chip { display: inline-flex; align-items: center; gap: 5px; margin-left: 8px; padding: 3px 7px; border-radius: 5px; color: var(--blue); background: var(--blue-soft); font-size: 10px; font-weight: 600; }
    .thread-chip i { width: 5px; height: 5px; border-radius: 50%; background: var(--blue); }
    .head-actions { display: flex; align-items: center; gap: 8px; }
    .head-actions .icon-btn { width: 32px; height: 32px; border: 1px solid var(--line); background: #fff; }
    .head-actions .icon-btn:hover { color: var(--blue); border-color: #a9c7f6; background: var(--blue-soft); }
    .head-actions .primary { color: #fff; background: var(--blue); border-color: var(--blue); }
    .head-actions .primary:hover { color: #fff; background: #2d6fdf; }
    .head-divider { height: 25px; width: 1px; margin: 0 4px; background: var(--line); }
    .workspace-body { display: grid; grid-template-columns: 205px 205px 330px minmax(340px, 1fr); flex: 1; min-height: 0; background: #f6f9fc; }
    .log { display: flex; align-self: start; height: 420px; margin: 14px; flex-direction: column; min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #fff; box-shadow: 0 3px 12px rgba(55,84,115,.05); }
    .log-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 17px; border-bottom: 1px solid var(--line); }
    .log-head h2 { margin: 0; font-size: 14px; font-weight: 650; }
    .log-tools { display: flex; gap: 7px; }
    .log-tools .icon-btn { width: 27px; height: 27px; font-size: 14px; }
    .log-list { flex: 1; overflow: auto; padding: 4px 10px 0; background: #fcfdff; }
    .log-row { display: grid; grid-template-columns: 55px 35px 1fr; gap: 7px; padding: 6px 3px; border-bottom: 1px solid #eef2f6; font-family: Consolas, "Microsoft YaHei", monospace; font-size: 11px; }
    .log-row time { color: #377fc1; }
    .log-row .level { color: #4c7394; font-weight: 700; }
    .log-row .message { color: #263f56; }
    .log-row.warn .level { color: var(--yellow); }
    .log-row.success .level { color: var(--green); }
    .command { display: flex; gap: 6px; padding: 7px 9px; border-top: 1px solid var(--line); background: #f6f9fc; }
    .command input { flex: 1; min-width: 0; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: 5px; outline: none; color: var(--text); background: #fff; }
    .command button { padding: 0 14px; border-radius: 5px; color: #fff; background: var(--blue); }
    .empty { padding: 30px 12px; color: var(--muted); text-align: center; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px); padding: 9px 14px; border: 1px solid #b9d0ee; border-radius: 6px; color: #245a9c; background: #eef6ff; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: .2s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 1150px) {
      body { min-width: 900px; }
      .app { grid-template-columns: 52px 195px minmax(0, 1fr); }
      .account { padding-left: 8px; padding-right: 8px; }
      .workspace-body { grid-template-columns: 180px 185px 290px minmax(300px, 1fr); }
    }

    /* Style sandbox scale: keep the preview readable without a packaging step. */
    body { min-width: 1180px; color: #203448; font: 15px/1.5 "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif; }
    .app { grid-template-columns: 58px 238px minmax(0, 1fr); }
    .pane-top { padding: 18px 14px 12px; }
    .account-actions { padding: 0 14px 12px; }
    .column-head h2, .log-head h2 { font-size: 16px; }
    .catalog-group { font-size: 12px; }
    .catalog-item, .task-tab strong { font-size: 13px; }
    .catalog-item small, .task-tab small, .account-detail, .account-status { font-size: 12px; }
    .settings-pane { padding: 17px; }
    .config-card-head h3 { font-size: 16px; }
    .config-card-head p, .form-item label { font-size: 12px; }
    .form-item input, .form-item select { min-height: 36px; font-size: 13px; }
    .workspace-body { grid-template-columns: 220px 220px 360px minmax(340px, 1fr); }
    .window-bind { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 14px; padding: 11px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
    .window-bind-copy { min-width: 0; }
    .window-bind-copy strong, .window-bind-copy small { display: block; }
    .window-bind-copy strong { font-size: 13px; }
    .window-bind-copy small { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .window-bind select { min-width: 0; width: 100%; padding: 8px; border: 1px solid var(--line-strong); border-radius: 5px; color: var(--text); background: #fff; }
    .window-bind select, .window-bind button { grid-column: 1; }
    .window-bind button { padding: 7px 11px; border-radius: 5px; color: var(--blue); background: var(--blue-soft); font-size: 12px; }
    .window-bind button:hover { background: #d6e6ff; }
    .window-bind-status { grid-column: 1 / -1; color: var(--muted); font-size: 11px; }
    .config-foot button { font-size: 12px; }
    .log-row { font-size: 12px; }
    .toast { z-index: 10; font-size: 13px; }
    .preview-badge { margin-right: auto; margin-left: 18px; padding: 5px 8px; border: 1px solid #d7e4f2; border-radius: 5px; color: #54718d; background: #f4f8fc; font-size: 11px; }
    body { text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
    @media (max-width: 1320px) {
      .workspace-body { grid-template-columns: minmax(180px, .9fr) minmax(180px, .9fr) minmax(300px, 1.45fr) minmax(260px, 1.15fr); }
      .log { margin: 10px; }
      .log-head { padding-left: 13px; padding-right: 13px; }
      .log-list { padding-left: 8px; padding-right: 8px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="rail-logo">✦</div>
      <nav class="rail-nav">
        <button class="rail-btn active" data-toast="工作台">▣</button>
        <button class="rail-btn" data-toast="运行消息">▰</button>
        <button class="rail-btn" data-toast="账号管理">●</button>
        <button class="rail-btn" data-toast="工具">▥</button>
        <button class="rail-btn" data-toast="云端与更新">☁</button>
      </nav>
      <div class="rail-spacer"></div>
      <button class="rail-btn rail-menu" data-toast="更多菜单">☰</button>
    </aside>

    <section class="accounts">
      <div class="pane-top">
        <div class="search-wrap"><span class="search-mark">⌕</span><input id="accountSearch" placeholder="搜索账号"></div>
        <button class="icon-btn" id="addAccount" title="添加账号">＋</button>
      </div>
      <div class="account-actions">
        <button class="icon-btn" id="startAll" title="全部启动">▷</button>
        <button class="icon-btn" id="pauseAll" title="全部暂停">Ⅱ</button>
        <button class="icon-btn" id="refreshAll" title="刷新状态">↻</button>
        <button class="icon-btn" id="layoutBtn" title="切换布局">▣</button>
      </div>
      <div class="account-list" id="accountList"></div>
      <button class="new-account" id="newAccount">＋ 添加账号 / 窗口</button>
    </section>

    <main class="workspace">
      <header class="workspace-head">
        <div class="selected-title">
          <div class="account-avatar blue" id="selectedAvatar">大</div>
          <div><h1 id="selectedName">大号 · 青行灯 <span class="thread-chip"><i></i>独立线程</span></h1><p id="selectedDevice">oas1 · MuMu 12 · 窗口 01 · 127.0.0.1:16384</p></div>
        </div>
        <span class="preview-badge">样式预览 · 模拟数据</span>
        <div class="head-actions">
          <button class="icon-btn primary" id="runSelected" title="启动当前账号">▷</button>
          <button class="icon-btn" id="stopSelected" title="停止当前账号">×</button>
          <button class="icon-btn" id="restartSelected" title="重启当前账号">↻</button>
          <span class="head-divider"></span>
          <button class="icon-btn" id="settings" title="账号设置">☷</button>
          <button class="icon-btn" id="more" title="更多">•••</button>
        </div>
      </header>
      <div class="workspace-body">
        <section class="catalog-pane">
          <div class="column-head"><h2>全部任务</h2><small id="catalogCount"></small></div>
          <input class="catalog-search" id="catalogSearch" placeholder="搜索全部功能">
          <div id="catalogList"></div>
        </section>
        <section class="selected-pane">
          <div class="column-head"><h2>当前账号任务</h2><small id="selectedCount"></small></div>
          <div class="selected-task-list" id="selectedTasks"></div>
          <div class="config-empty">点击任务查看配置</div>
        </section>
        <section class="settings-pane">
          <div class="column-head"><h2>任务设置</h2><small id="settingsHint">当前账号独立配置</small></div>
          <div id="taskConfig"></div>
        </section>
        <section class="log">
          <div class="log-head">
            <h2>运行日志</h2>
            <div class="log-tools"><button class="icon-btn" id="clearLog" title="清空日志">⌫</button><button class="icon-btn" id="logInfo" title="日志说明">ⓘ</button><button class="icon-btn" id="logRefresh" title="刷新日志">↻</button></div>
          </div>
          <div class="log-list" id="logList"></div>
          <div class="command"><input id="commandInput" placeholder="输入命令或备注，回车发送..."><button id="sendCommand">发送</button></div>
        </section>
      </div>
    </main>
  </div>
  <div class="toast" id="toast"></div>

          ["20:22:01", "INFO", "开始执行日常小杂事", ""],
          ["20:22:05", "INFO", "签到完成", ""],
          ["20:22:11", "INFO", "邮件领取完成", ""],
          ["20:22:18", "INFO", "悬赏封印检查完成", "success"]
        ]
      },
      test: {
        avatar: "活", avatarClass: "gold", name: "活动号 · 未命名", id: "oas3",
        device: "等待绑定设备", window: "", state: "paused", stateText: "待处理",
        selected: [["活动爬塔", "限时活动 · 暂未配置", "paused"]],
        available: ["活动爬塔", "超鬼王", "对弈竞猜", "智力答题"],
        logs: [["20:20:10", "WARN", "等待设备连接", "warn"], ["20:20:10", "INFO", "请在账号与窗口中完成绑定", ""]]
      }
    };
    const allTasks = ["逢魔之时", "斗技挂机", "寮30", "真·八岐大蛇", "免费获取庭院活动", "花合战", "式神委派", "商店杂货铺", "秘卷屋兑换", "寮勋商店", "爬塔活动", "账号登录", "日常小杂事", "悬赏封印", "结界突破", "御魂整理", "活动爬塔"];
    let current = "yys1";
    const $ = (id) => document.getElementById(id);
    const toast = $("toast");
    let toastTimer;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1900);
    }
    function statusClass(account) { return account.state === "running" ? "running" : account.state === "paused" ? "paused" : "offline"; }
    function renderAccounts(filter = "") {
      const list = $("accountList");
      list.innerHTML = "";
      Object.entries(accounts).filter(([, a]) => !filter || (a.name + a.id).toLowerCase().includes(filter.toLowerCase())).forEach(([id, account]) => {
        const button = document.createElement("button");
        button.className = "account " + statusClass(account) + (id === current ? " selected" : "");
        button.dataset.id = id;
        button.innerHTML = '<span class="account-avatar ' + account.avatarClass + '">' + account.avatar + '</span>' +
          '<span class="account-copy"><span class="account-name">' + account.name + '</span>' +
          '<span class="account-detail">' + account.id + ' · ' + account.device.split(" · ")[0] + '</span>' +
          '<span class="account-status"><i class="status-dot"></i>' + account.stateText + '</span></span>';
        button.addEventListener("click", () => { current = id; renderAll(); showToast("已切换到 " + account.name); });
        list.appendChild(button);
      });
    }
    function renderCatalog() {
      const account = accounts[current];
      const filter = $("catalogSearch").value.trim().toLowerCase();
      const selectedNames = new Set(account.selected.map((task) => task[0]));
      const visibleTasks = allTasks.filter((name) => !filter || name.toLowerCase().includes(filter));
      $("catalogCount").textContent = allTasks.length + " 项";
      $("catalogList").innerHTML = '<div class="catalog-group">全部功能</div>' + visibleTasks.map((name) =>
        '<button class="catalog-item ' + (selectedNames.has(name) ? "active" : "") + '" data-catalog-task="' + name + '"><span>' + name + '<small>' + (selectedNames.has(name) ? " · 已选择" : "") + '</small></span><span>' + (selectedNames.has(name) ? "✓" : "＋") + '</span></button>'
      ).join("");
      document.querySelectorAll("[data-catalog-task]").forEach((button) => button.addEventListener("click", () => {
        const name = button.dataset.catalogTask;
        const index = account.selected.findIndex((task) => task[0] === name);
        if (index >= 0) {
          account.activeTask = index;
          renderSelectedTasks();
          renderTaskConfig();
          return;
        }
        account.selected.push([name, "自定义任务 · 当前账号", "scheduled"]);
        account.available = account.available.filter((item) => item !== name);
        account.activeTask = account.selected.length - 1;
        renderCatalog();
        renderSelectedTasks();
        renderTaskConfig();
        showToast(name + " 已添加到 " + account.name);
      }));
    }
    function renderSelectedTasks() {
      const account = accounts[current];
      account.activeTask = Math.min(account.activeTask || 0, Math.max(account.selected.length - 1, 0));
      $("selectedCount").textContent = account.selected.length + " 个";
      $("selectedTasks").innerHTML = account.selected.length ? account.selected.map((task, index) =>
        '<div class="task-tab ' + (index === account.activeTask ? "active" : "") + '" data-task-index="' + index + '"><span><strong>' + task[0] + '</strong><small>' + (task[2] === "running" ? "运行中" : task[2] === "paused" ? "已暂停" : "已启用") + '</small></span><button class="remove-task" data-remove-task="' + index + '" title="移除">×</button></div>'
      ).join("") : '<div class="config-empty">当前账号还没有选择任务</div>';
      document.querySelectorAll("[data-task-index]").forEach((button) => button.addEventListener("click", () => {
        account.activeTask = Number(button.dataset.taskIndex);
        renderSelectedTasks();
        renderTaskConfig();
      }));
      document.querySelectorAll("[data-remove-task]").forEach((button) => button.addEventListener("click", (event) => {
        event.stopPropagation();
        const removed = account.selected.splice(Number(button.dataset.removeTask), 1)[0];
        account.available.push(removed[0]);
        account.activeTask = Math.min(account.activeTask || 0, Math.max(account.selected.length - 1, 0));
        renderCatalog();
        renderSelectedTasks();
        renderTaskConfig();
        showToast(removed[0] + " 已从当前账号移除");
      }));
    }
    function renderTaskConfig() {
      const account = accounts[current];
      account.activeTask = Math.min(account.activeTask || 0, Math.max(account.selected.length - 1, 0));
      if (!account.selected.length) {
        $("settingsHint").textContent = "暂无任务";
        $("taskConfig").innerHTML = '<div class="config-empty">从左侧全部任务中选择一个功能</div>';
        return;
      }
      const task = account.selected[account.activeTask];
      $("settingsHint").textContent = task[0] + " · 当前账号";
      $("taskConfig").innerHTML =
        '<div class="config-card">' +
          '<div class="config-card-head"><div><h3>' + task[0] + '</h3><p>' + task[1] + ' · 仅对当前账号生效</p></div>' +
          '<label class="switch" title="启用此功能"><input type="checkbox" ' + (task[2] !== "paused" ? "checked" : "") + '><span></span></label></div>' +
          '<div class="form-grid">' +
            '<div class="form-item"><label>执行计划</label><select><option>每天 09:00</option><option>每天 12:30</option><option>完成后立即执行</option></select></div>' +
            '<div class="form-item"><label>优先级</label><input value="5"></div>' +
            '<div class="form-item"><label>执行次数</label><input value="30"></div>' +
            '<div class="form-item"><label>队伍方案</label><select><option>默认队伍</option><option>御魂队伍 1</option><option>御魂队伍 2</option></select></div>' +
          '</div>' +
          '<div class="window-bind"><div class="window-bind-copy"><strong>窗口绑定</strong><small>样式预览：选择需要控制的游戏或模拟器窗口</small></div>' +
            '<select data-window-select><option value="">不绑定窗口</option><option value="2303">2303 · 游戏窗口</option><option value="MuMu模拟器">MuMu模拟器 · 外层窗口</option><option value="MuMuNxDevice">MuMuNxDevice · 设备窗口</option></select>' +
            '<button data-bind-window>绑定窗口</button><small class="window-bind-status" data-window-status></small></div>' +
          '<div class="config-foot"><span class="save-state">● 自动保存</span><button data-advanced-config>高级设置</button><button data-save-config>保存配置</button></div>' +
        '</div>';
      const windowSelect = document.querySelector("[data-window-select]");
      const windowStatus = document.querySelector("[data-window-status]");
      const boundWindow = account.window || "";
      windowSelect.value = boundWindow;
      windowStatus.textContent = boundWindow ? "当前绑定：" + boundWindow + "（模拟数据）" : "当前未绑定窗口";
      document.querySelector("[data-bind-window]").addEventListener("click", () => {
        account.window = windowSelect.value;
        windowStatus.textContent = account.window ? "当前绑定：" + account.window + "（模拟数据）" : "当前未绑定窗口";
        showToast(account.window ? "已绑定窗口 " + account.window + "（预览）" : "已清除窗口绑定（预览）");
      });
      document.querySelector("[data-save-config]").addEventListener("click", () => showToast(task[0] + " 配置已保存"));
      document.querySelector("[data-advanced-config]").addEventListener("click", () => showToast("打开 " + task[0] + " 高级设置"));
    }
    function renderLogs() {
      const account = accounts[current];
      $("logList").innerHTML = account.logs.slice(-8).map((log) =>
        '<div class="log-row ' + log[3] + '"><time>' + log[0] + '</time><span class="level">' + log[1] + '</span><span class="message">' + log[2] + '</span></div>'
      ).join("");
      $("logList").scrollTop = $("logList").scrollHeight;
    }
    function renderAll() {
      const account = accounts[current];
      renderAccounts($("accountSearch").value);
      renderCatalog();
      renderSelectedTasks();
      renderTaskConfig();
      renderLogs();
      $("selectedAvatar").className = "account-avatar " + account.avatarClass;
      $("selectedAvatar").textContent = account.avatar;
      $("selectedName").innerHTML = account.name + ' <span class="thread-chip"><i></i>独立线程</span>';
      $("selectedDevice").textContent = account.id + " · " + account.device;
    }
    function appendLog(level, message, extraClass = "") {
      accounts[current].logs.push([new Date().toLocaleTimeString("zh-CN", { hour12: false }).slice(0, 8), level, message, extraClass]);
      renderLogs();
    }
    $("accountSearch").addEventListener("input", (event) => renderAccounts(event.target.value));
    $("catalogSearch").addEventListener("input", renderCatalog);
    $("runSelected").addEventListener("click", () => {
      accounts[current].state = "running";
      accounts[current].stateText = "运行中 · 当前任务";
      renderAll(); appendLog("INFO", "已启动当前账号独立线程", "success"); showToast("已启动 " + accounts[current].name);
    });
    $("stopSelected").addEventListener("click", () => {
      accounts[current].state = "paused";
      accounts[current].stateText = "已暂停";
      renderAll(); appendLog("INFO", "已暂停当前账号", "success"); showToast("已暂停 " + accounts[current].name);
    });
    $("restartSelected").addEventListener("click", () => { appendLog("INFO", "正在重启当前账号线程"); showToast("正在重启 " + accounts[current].name); });
    $("startAll").addEventListener("click", () => { Object.values(accounts).forEach((a) => { if (a.state !== "offline") { a.state = "running"; a.stateText = "运行中 · 独立线程"; } }); renderAll(); showToast("已启动全部可用账号"); });
    $("pauseAll").addEventListener("click", () => { Object.values(accounts).forEach((a) => { if (a.state !== "offline") { a.state = "paused"; a.stateText = "已暂停"; } }); renderAll(); showToast("已暂停全部账号"); });
    $("refreshAll").addEventListener("click", () => showToast("状态已刷新"));
    $("layoutBtn").addEventListener("click", () => showToast("当前为账号 + 配置 + 日志布局"));
    ["addAccount", "newAccount"].forEach((id) => $(id).addEventListener("click", () => showToast("打开添加账号 / 窗口向导")));
    $("settings").addEventListener("click", () => showToast("打开当前账号设置"));
    $("more").addEventListener("click", () => showToast("更多操作"));
    $("clearLog").addEventListener("click", () => { accounts[current].logs = []; renderLogs(); showToast("已清空当前日志"); });
    $("logRefresh").addEventListener("click", () => { renderLogs(); showToast("日志已刷新"); });
    $("logInfo").addEventListener("click", () => showToast("日志只显示当前账号的独立线程"));
    function sendCommand() {
      const value = $("commandInput").value.trim();
      if (!value) return;
      appendLog("CMD", value);
      $("commandInput").value = "";
      showToast("命令已发送到当前线程");
    }
    $("sendCommand").addEventListener("click", sendCommand);
    $("commandInput").addEventListener("keydown", (event) => { if (event.key === "Enter") sendCommand(); });
    document.querySelectorAll(".rail-btn").forEach((button) => button.addEventListener("click", () => {
      document.querySelectorAll(".rail-btn").forEach((item) => item.classList.remove("active"));
      button.classList.add("active");
      showToast(button.dataset.toast);
    }));
    renderAll();
  </script>
</body>
</html>
