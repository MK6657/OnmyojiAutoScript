<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OAS frontend preview launcher</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", sans-serif; color: #203448; background: #edf2f7; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; }
      main { max-width: 560px; margin: 24px; padding: 28px; border: 1px solid #d9e1ea; border-radius: 12px; background: #fff; box-shadow: 0 12px 32px rgba(55, 84, 115, .1); }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { color: #63788d; line-height: 1.6; }
      a { display: inline-block; margin-top: 8px; padding: 10px 14px; border-radius: 7px; color: #fff; background: #387cf0; text-decoration: none; }
      code { padding: 2px 5px; border-radius: 4px; background: #f2f6fa; }
    </style>
  </head>
  <body>
    <main>
      <h1>OAS frontend preview</h1>
      <p>This launcher uses the real <code>control-center/frontend</code> source. Start <code>start-preview.ps1</code> first, then open the preview server.</p>
      <a href="http://127.0.0.1:4173/">Open real frontend preview</a>
    </main>
  </body>
</html>
